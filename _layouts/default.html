<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ site.title }} · AI Engineer & Quant Developer</title>
<meta name="description" content="Liang (Leon) Wu — AI engineer & quantitative developer. Deep learning, agentic LLM systems, and trading infrastructure.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
<link rel="stylesheet" href="/css/main.css?v={{ site.time | date: '%s' }}">
</head>

<body>
	<header class="topbar">
		<div class="topbar-inner">
			<a class="brand" href="#top">Liang Wu</a>
			<nav class="nav">
				<a href="#projects">Projects</a>
				<a href="#experience">Experience</a>
				<a href="#research">Research</a>
				<a href="#publications">Publications</a>
				<a href="#education">Education</a>
			</nav>
		</div>
	</header>

	<main id="top" class="container">
		{{ content }}
	</main>

	<footer class="footer">
		<div class="container">
			<span class="dim">Built with Jekyll · Hosted on GitHub Pages</span>
			<span class="dim">© {{ site.time | date: '%Y' }} Liang Wu</span>
		</div>
	</footer>

	<dialog class="lightbox" id="lightbox" aria-label="Image preview">
		<button class="lightbox-close" type="button" aria-label="Close">&times;</button>
		<img alt="">
	</dialog>
	<script>
	(function () {
		var box = document.getElementById('lightbox');
		var img = box.querySelector('img');
		document.querySelectorAll('.shots a').forEach(function (a) {
			a.addEventListener('click', function (e) {
				e.preventDefault();
				var thumb = a.querySelector('img');
				img.src = a.getAttribute('href');
				img.alt = thumb ? thumb.alt : '';
				box.showModal();
			});
		});
		box.querySelector('.lightbox-close').addEventListener('click', function () { box.close(); });
		box.addEventListener('click', function (e) { if (e.target === box) box.close(); });
		box.addEventListener('close', function () { img.removeAttribute('src'); });
	})();
	</script>
</body>
</html>
